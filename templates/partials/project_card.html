<a href="/project/{{ p.id }}" class="project-card" style="text-decoration:none;">
  <div style="aspect-ratio:16/9;overflow:hidden;background:oklch(0.22 0.02 160);">
    {% if p.image_url %}
      <img src="{{ p.image_url }}" alt="{{ p.name }}" loading="lazy"
           style="width:100%;height:100%;object-fit:cover;transition:transform 0.3s;" 
           onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
    {% else %}
      <div style="display:flex;height:100%;align-items:center;justify-content:center;">
        {% if p.type == 'mod' %}
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="oklch(0.6 0.2 240)" stroke-width="1.5" opacity="0.3" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/></svg>
        {% else %}
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="oklch(0.75 0.18 80)" stroke-width="1.5" opacity="0.3" stroke-linecap="round" stroke-linejoin="round"><path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"/><line x1="16" x2="2" y1="8" y2="22"/><line x1="17.5" x2="9" y1="15" y2="15"/></svg>
        {% endif %}
      </div>
    {% endif %}
  </div>
  <div style="display:flex;flex:1;flex-direction:column;gap:0.5rem;padding:1rem;">
    <div style="display:flex;align-items:center;gap:0.5rem;">
      {% if p.type == 'mod' %}
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="oklch(0.6 0.2 240)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/></svg>
      <span style="font-size:0.7rem;text-transform:uppercase;letter-spacing:0.05em;color:oklch(0.6 0.2 240);">Mod</span>
      {% else %}
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="oklch(0.75 0.18 80)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"/><line x1="16" x2="2" y1="8" y2="22"/><line x1="17.5" x2="9" y1="15" y2="15"/></svg>
      <span style="font-size:0.7rem;text-transform:uppercase;letter-spacing:0.05em;color:oklch(0.75 0.18 80);">Plugin</span>
      {% endif %}
    </div>
    <h3 style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ p.name }}</h3>
    <p style="font-size:0.875rem;color:oklch(0.65 0.02 160);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;">{{ p.description or "Tavsif yo'q" }}</p>
    <div style="margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:0.75rem;font-size:0.75rem;color:oklch(0.65 0.02 160);">
      <span>{{ p.loader or p.mc_version or "—" }}</span>
      <span style="display:inline-flex;align-items:center;gap:0.25rem;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
        {{ p.downloads }}
      </span>
    </div>
  </div>
</a>
